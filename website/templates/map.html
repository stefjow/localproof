<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>LOCALPROOF: MAP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.3.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .overlay-circle {
            background: {% if nonce %}rgba(100, 100, 100, 1){% elif success == 'true' %}rgba(0, 97, 100, 1){% else %}rgba(219, 67, 37, 1){% endif %};
        }
    </style>
</head>
<body class="page page-map">
    {% if status or nonce %}
    <div class="overlay" id="status-overlay">
        <div class="overlay-circle" id="overlay-circle">
            <svg viewBox="0 0 100 100">
                {% if nonce %}
                <text id="overlay-mark" x="50" y="55" text-anchor="middle" dominant-baseline="middle">?</text>
                {% elif success == 'true' %}
                <text x="50" y="60" text-anchor="middle" dominant-baseline="middle">✓</text>
                {% else %}
                <text x="50" y="55" text-anchor="middle" dominant-baseline="middle">✗</text>
                {% endif %}
            </svg>
        </div>
        <div class="overlay-status" id="overlay-status-text">{{ status or 'Verifying presence…' }}</div>
    </div>
    {% endif %}
    <div id="map"></div>
    {% include '_auth_panel.html' %}
    <script src="https://unpkg.com/maplibre-gl@5.3.1/dist/maplibre-gl.js"></script>
    <script>
        // MapLibre GL: raster tiles from CARTO dark_all give us native dark
        // tiles (no CSS-filter hack), and globe projection turns it into a globe.
        const cartoDarkStyle = {
            version: 8,
            sources: {
                carto: {
                    type: 'raster',
                    tiles: [
                        'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                        'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                        'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                        'https://d.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                    ],
                    tileSize: 256,
                    attribution: '© <a href="https://carto.com/attributions">CARTO</a>',
                }
            },
            layers: [{ id: 'carto', type: 'raster', source: 'carto' }],
            sky: {}
        };

        const map = new maplibregl.Map({
            container: 'map',
            style: cartoDarkStyle,
            center: [0, 20],
            zoom: 1.2,
            attributionControl: { compact: true },
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
        map.on('style.load', () => { map.setProjection({ type: 'globe' }); });

        const registeredMarkers = [];
        const markers = [];
        const bounds = new maplibregl.LngLatBounds();

        function roundToFourDecimals(num) { return Math.round(num * 10000) / 10000; }

        function makeEmojiMarker(emoji) {
            const el = document.createElement('div');
            el.className = 'emoji-marker';
            el.textContent = emoji;
            return new maplibregl.Marker({ element: el });
        }

        async function fetchValidationLogs(deviceId) {
            try {
                const r = await fetch(`/validation-logs/${encodeURIComponent(deviceId)}`);
                if (!r.ok) throw new Error('logs fetch failed');
                return await r.json();
            } catch (e) { console.error(e); return []; }
        }

        function renderValidationLogs(logs) {
            const success = logs.filter(l => l.status === 'success');
            if (!success.length) return '<p>No successful validation attempts.</p>';
            let out = '<table class="validation-table"><thead><tr><th>Timestamp</th><th>User</th></tr></thead><tbody>';
            for (const l of success) out += `<tr><td>${l.timestamp}</td><td>${l.username}</td></tr>`;
            return out + '</tbody></table>';
        }

        {% if current_user.is_authenticated %}
        const inactiveMarkers = [];
        async function loadInactiveDevices() {
            try {
                const r = await fetch('/api/my-inactive-devices');
                const devices = await r.json();
                inactiveMarkers.forEach(m => m.remove());
                inactiveMarkers.length = 0;
                for (const d of devices) {
                    if (d.lat == null || d.lng == null) continue;
                    const el = document.createElement('div');
                    el.className = 'maplibregl-marker-default inactive';
                    const marker = new maplibregl.Marker({ element: el })
                        .setLngLat([d.lng, d.lat])
                        .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(
                            `<div class="popup-content">Device ID: ${d.device_id}<br><hr><strong>Validate once to add it to the map.</strong></div>`))
                        .addTo(map);
                    inactiveMarkers.push(marker);
                }
            } catch (e) { console.error(e); }
        }
        loadInactiveDevices();
        {% endif %}

        // Devices from the server (all currently active)
        {% for device in devices %}
        (function () {
            const deviceId = {{ device.device_id|tojson }};
            const lat = {{ device.lat }};
            const lng = {{ device.lng }};
            const name = {{ (device.name or '')|tojson }};
            const owner = {{ device.username|tojson }};
            const maxV = {{ device.max_validations }};
            const currentUser = {{ username|tojson }};
            const popup = new maplibregl.Popup({ offset: 14, maxWidth: '360px' }).setHTML('Loading…');
            const marker = new maplibregl.Marker()
                .setLngLat([lng, lat])
                .setPopup(popup)
                .addTo(map);
            popup.on('open', async () => {
                const logs = await fetchValidationLogs(deviceId);
                const ownerLink = (currentUser === owner)
                    ? `<a href="/my-devices#device-${encodeURIComponent(deviceId)}">Edit / Manage →</a>` : '';
                popup.setHTML(`
                    <div class="popup-headline">${name || deviceId}</div>
                    <div class="popup-content">
                        Device: ${deviceId}<br>
                        Location: ${roundToFourDecimals(lat)}, ${roundToFourDecimals(lng)}<br>
                        Max validations / cycle: ${maxV}
                        <hr>
                        <strong>Successful validations:</strong>
                        <div class="popup-scroll">${renderValidationLogs(logs)}</div>
                        <div class="popup-links">
                            <a href="/devices/${encodeURIComponent(deviceId)}/history">Full history →</a>
                            ${ownerLink}
                        </div>
                    </div>
                `);
            });
            markers.push(marker);
            bounds.extend([lng, lat]);
        })();
        {% endfor %}

        {% if esp_lat and esp_lng %}
        (function () {
            const espMarker = makeEmojiMarker('🛰️')
                .setLngLat([{{ esp_lng }}, {{ esp_lat }}])
                .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML(`
                    <div class="popup-headline">Device Location (from ESP32 GPS)</div>
                    <div class="popup-content">
                        Location: ${roundToFourDecimals({{ esp_lat }})}, ${roundToFourDecimals({{ esp_lng }})}
                    </div>`))
                .addTo(map);
            markers.push(espMarker);
            bounds.extend([{{ esp_lng }}, {{ esp_lat }}]);
            {% if device_lat and device_lng %}
            bounds.extend([{{ device_lng }}, {{ device_lat }}]);
            {% endif %}
            map.fitBounds(bounds, { padding: 60, maxZoom: 15, duration: 0 });
        })();
        {% else %}
        map.on('load', () => {
            if (!bounds.isEmpty()) {
                map.fitBounds(bounds, { padding: 40, maxZoom: 6, duration: 0 });
            }
        });
        {% endif %}

        // Challenge flow: answer the server's nonce with our geolocation, then render the result.
        {% if nonce %}
        (function () {
            let scannerPos = null;

            function completeValidation() {
                const body = { nonce: '{{ nonce }}' };
                if (scannerPos) {
                    body.scanner_lat = scannerPos.coords.latitude;
                    body.scanner_lng = scannerPos.coords.longitude;
                }
                fetch('/validate/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                })
                .then(r => r.json())
                .then(showResult)
                .catch(() => showResult({ success: false, status: 'Validation Error' }));
            }

            function showResult(data) {
                document.getElementById('overlay-circle').style.background =
                    data.success ? 'rgba(0, 97, 100, 1)' : 'rgba(219, 67, 37, 1)';
                document.getElementById('overlay-mark').textContent = data.success ? '✓' : '✗';
                document.getElementById('overlay-status-text').textContent = data.status;

                if (data.esp_lat && data.esp_lng) {
                    const espMarker = makeEmojiMarker('🛰️')
                        .setLngLat([data.esp_lng, data.esp_lat])
                        .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML(`
                            <div class="popup-headline">Device Location (from ESP32 GPS)</div>
                            <div class="popup-content">
                                Location: ${roundToFourDecimals(data.esp_lat)}, ${roundToFourDecimals(data.esp_lng)}
                            </div>`))
                        .addTo(map);
                    markers.push(espMarker);

                    const b = new maplibregl.LngLatBounds();
                    b.extend([data.esp_lng, data.esp_lat]);

                    if (scannerPos) {
                        const sm = makeEmojiMarker('📱')
                            .setLngLat([scannerPos.coords.longitude, scannerPos.coords.latitude])
                            .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML(`
                                <div class="popup-headline">Your Location (from Browser)</div>
                                <div class="popup-content">
                                    Location: ${roundToFourDecimals(scannerPos.coords.latitude)}, ${roundToFourDecimals(scannerPos.coords.longitude)}
                                </div>`))
                            .addTo(map);
                        markers.push(sm);
                        b.extend([scannerPos.coords.longitude, scannerPos.coords.latitude]);
                    }
                    if (data.device_lat && data.device_lng) b.extend([data.device_lng, data.device_lat]);
                    map.fitBounds(b, { padding: 60, maxZoom: 15, duration: 0 });
                }
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (p) => { scannerPos = p; completeValidation(); },
                    () => { completeValidation(); },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
                );
            } else {
                completeValidation();
            }
        })();
        {% endif %}

        // Hide the overlay after 10 seconds or on user interaction.
        (function () {
            const overlay = document.getElementById('status-overlay');
            if (!overlay) return;
            const hide = () => { overlay.style.display = 'none'; };
            setTimeout(hide, 10000);
            overlay.addEventListener('click', hide);
            document.addEventListener('keydown', hide);
        })();

        // Right-click / long-tap to register a new device (login required).
        map.on('contextmenu', (e) => {
            {% if not current_user.is_authenticated %}
            alert('You must be logged in to add a device.');
            return;
            {% endif %}
            const lat = e.lngLat.lat, lng = e.lngLat.lng;
            const popup = new maplibregl.Popup({ maxWidth: '360px' })
                .setLngLat(e.lngLat)
                .setHTML(`
                    <div class="popup-headline">Register Device</div>
                    <div class="popup-content register-form">
                        <label>Name (optional)<input type="text" id="reg-name" maxlength="80" placeholder="e.g. Front door"></label>
                        <label>Description (optional)<input type="text" id="reg-description" maxlength="200"></label>
                        <label>Max validations / cycle<input type="number" id="reg-max-validations" min="1" value="1" required></label>
                        <label>Public key (PEM)
                            <textarea id="reg-pubkey" rows="4" placeholder="-----BEGIN PUBLIC KEY-----&#10;from hw_probe + 'python_generator_v2.py pem', or generate below"></textarea>
                        </label>
                        <button type="button" onclick="generateBrowserKeypair()">Generate keypair in browser</button>
                        <div id="reg-privkey-box" style="display:none;">
                            <strong>Private key — copy it now, it is not stored anywhere:</strong>
                            <textarea id="reg-privkey" rows="5" readonly onclick="this.select()"></textarea>
                        </div>
                        <button type="button" onclick="registerDevice(${lat}, ${lng}, this)">Register Device</button>
                    </div>
                `)
                .addTo(map);
        });

        function pemEncode(buffer, label) {
            const b64 = btoa(String.fromCharCode(...new Uint8Array(buffer)));
            return `-----BEGIN ${label}-----\n${b64.match(/.{1,64}/g).join('\n')}\n-----END ${label}-----`;
        }

        async function generateBrowserKeypair() {
            const keys = await crypto.subtle.generateKey(
                { name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
            const pub = await crypto.subtle.exportKey('spki', keys.publicKey);
            const priv = await crypto.subtle.exportKey('pkcs8', keys.privateKey);
            document.getElementById('reg-pubkey').value = pemEncode(pub, 'PUBLIC KEY');
            document.getElementById('reg-privkey').value = pemEncode(priv, 'PRIVATE KEY');
            document.getElementById('reg-privkey-box').style.display = 'block';
        }

        function registerDevice(lat, lng, button) {
            let maxV = parseInt(document.getElementById('reg-max-validations').value, 10);
            if (isNaN(maxV) || maxV < 1) maxV = 1;
            const pubkey = document.getElementById('reg-pubkey').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const description = document.getElementById('reg-description').value.trim();
            if (!pubkey) { alert('Paste the device public key or generate a keypair first.'); return; }
            button.disabled = true;
            button.textContent = 'Registering…';
            fetch('/add-device', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pubkey, lat, lng, max_validations: maxV, name, description }),
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const deviceId = data.device_id;
                    // Close popup by clearing the DOM element it lives in.
                    document.querySelectorAll('.maplibregl-popup').forEach(p => p.remove());
                    const el = document.createElement('div');
                    el.className = 'maplibregl-marker-default inactive';
                    const marker = new maplibregl.Marker({ element: el })
                        .setLngLat([lng, lat])
                        .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(
                            `<div class="popup-content">Device ID: ${deviceId}<br><hr><strong>Validate once to add it to the map.</strong></div>`))
                        .addTo(map);
                    registeredMarkers.push(marker);
                } else {
                    alert('Failed to register device: ' + data.message);
                    button.disabled = false;
                    button.textContent = 'Register Device';
                }
            })
            .catch(err => {
                alert('An error occurred: ' + err.message);
                button.disabled = false;
                button.textContent = 'Register Device';
            });
        }
    </script>
</body>
</html>
